name: Integrar reforço AZ-900

on:
  push:
    paths:
      - '.github/workflows/integrar-reforco.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Integrar links do reforço no index.html
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          sidebar_anchor = '<a href="reforco.html" class="nav-home-link" id="nav-reforco-link">🎯 Reforço — Meus pontos fracos</a>'
          if 'id="nav-reforco-link"' not in text:
              marker = '<a href="#simulado" class="nav-home-link" id="nav-simulado-link">📝 Simulado do exame</a>'
              if marker not in text:
                  raise SystemExit('Não encontrei o link do Simulado no menu.')
              text = text.replace(marker, marker + '\n    ' + sidebar_anchor, 1)

          home_card = '''        <a class="module-card" href="reforco.html" id="home-reforco-card">\n          <span class="module-num">🎯</span>\n          <span class="module-info"><h3>Reforço — Meus pontos fracos</h3><span>Monitoramento, arquitetura, governança, identidade, redes e CapEx/OpEx · conteúdo aprofundado</span></span>\n          <span class="module-arrow">›</span>\n        </a>\n'''
          if 'id="home-reforco-card"' not in text:
              marker = '<a class="module-card" data-goto="peg-consumo">'
              if marker not in text:
                  raise SystemExit('Não encontrei o Banco de Pegadinhas na página inicial.')
              text = text.replace(marker, home_card + marker, 1)

          path.write_text(text, encoding='utf-8')
      
      - name: Commit e push
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html já estava integrado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Integra reforço AZ-900 ao menu e página inicial"
          git push
